networks:
  proxy-tier:
    external: true

services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea-app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cpus: 0.2
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - ../environments/gitea.env
    volumes:
      - ../data/gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3031:3000"  # Resolved host port conflict (Moved from 3000 to 3031)
      - "2223:22"    # Resolved host port conflict (Moved from 2222 to 2223)
    networks:
      - proxy-tier
