networks:
  proxy-tier:
    name: proxy-tier
    driver: bridge

services:
  reverse-proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: proxy-manager
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cpus: 0.2
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "(wget -q --spider http://127.0.0.1:81 2>/dev/null) || (curl -fsS http://127.0.0.1:81 >/dev/null 2>&1) || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - '8080:80'
      - '8443:443'
      - '8181:81'
    volumes:
      - ../data/proxy/data:/data
      - ../data/proxy/certs:/etc/letsencrypt
    env_file:
      - ../environments/gateway.env
    networks:
      - proxy-tier
